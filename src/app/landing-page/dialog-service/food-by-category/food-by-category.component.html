<h2 class="by-category">Browse by Category</h2>
<ul class="cards-wrapper">
  @for (card of cardsArray; track card.title) {
    <li>
      <a
        class="category-card"
        routerLink="/oxalate"
        [queryParams]="{ category: card.title }"
        [attr.aria-label]="card.overlayText || card.title"
        (click)="selectCategory(card.title)"
      >
        <span
          class="category-icon"
          [ngClass]="styleFor(card.title).tint"
          aria-hidden="true"
        >
          <app-icon [name]="styleFor(card.title).icon" [size]="26" />
        </span>
        <span class="category-title">{{ card.title }}</span>
        <app-icon class="category-arrow" name="arrow-right" />
      </a>
    </li>
  }
</ul>

<div class="filter-inline-container" [ngClass]="{ 'dark-theme': isDarkTheme }">
  <!-- Category Dropdown (same names as before, now as hidden labels) -->
  <label class="sr-only" for="time">Filter by category</label>
  <select
    id="time"
    name="time"
    [(ngModel)]="filters.category"
    (ngModelChange)="applyFilters()"
    class="filter-inline-select"
    [class.active]="!!filters.category"
    >
    <option [ngValue]="''">Any Category</option>
    @for (category of categories; track category) {
      <option [ngValue]="category">
        {{ category }}
      </option>
    }
  </select>

  <!-- Level Dropdown -->
  <label class="sr-only" for="results">Filter by oxalate level</label>
  <select
    id="results"
    name="results"
    [(ngModel)]="filters.calc_level"
    (ngModelChange)="applyFilters()"
    class="filter-inline-select"
    [class.active]="!!filters.calc_level"
    >
    <option [ngValue]="''">All Levels</option>
    @for (level of calcLevels; track level) {
      <option [ngValue]="level">
        {{ level }}
      </option>
    }
  </select>

  <!-- Clear Filters Button -->
  <button type="button" class="btn-clear-inline" (click)="clearFilters()">
    <app-icon name="x" [size]="16" />
    <span>Clear</span>
  </button>
</div>

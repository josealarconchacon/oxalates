<form
  class="search-input-container"
  role="search"
  aria-label="Search foods"
  ngNoForm
  [ngClass]="{ 'dark-theme': isDarkTheme }"
  (submit)="onSubmit($event)"
>
  <span class="search-prefix-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false" role="presentation">
      <path
        d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
      />
    </svg>
  </span>
  <input
    #searchInputElement
    [(ngModel)]="searchQuery"
    (ngModelChange)="onSearchQueryChange($event)"
    (blur)="onBlur()"
    placeholder="Search foods, e.g. spinach"
    class="search-input"
    type="search"
    autocomplete="off"
    inputmode="search"
    enterkeyhint="search"
    aria-label="Search for a food"
  />
  <button
    *ngIf="hasSearchQuery"
    type="button"
    class="search-clear-button"
    aria-label="Clear search"
    (click)="onClearClick()"
  >
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" role="presentation">
      <path d="M18 6L6 18M6 6l12 12" />
    </svg>
  </button>
  <button type="submit" class="search-action-button">Search</button>
</form>

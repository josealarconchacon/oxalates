<form
  class="search-input-container"
  role="search"
  aria-label="Search foods"
  ngNoForm
  [ngClass]="{ 'dark-theme': isDarkTheme }"
  (submit)="onSubmit($event)"
  >
  <label class="sr-only" [for]="inputId">Search for a food</label>
  <span class="search-prefix-icon" aria-hidden="true">
    <app-icon name="search" [size]="20" />
  </span>
  <input
    #searchInputElement
    [id]="inputId"
    [(ngModel)]="searchQuery"
    (ngModelChange)="onSearchQueryChange($event)"
    (blur)="onBlur()"
    placeholder="Search foods, e.g. spinach"
    class="search-input"
    type="search"
    autocomplete="off"
    inputmode="search"
    enterkeyhint="search"
    />
  @if (hasSearchQuery) {
    <button
      type="button"
      class="search-clear-button"
      aria-label="Clear search"
      (click)="onClearClick()"
      >
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" role="presentation">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
  }
  <button type="submit" class="search-action-button">Search</button>
</form>

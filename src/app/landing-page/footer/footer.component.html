<footer class="footer" id="footer">
  <div class="footer-content">
    <div class="footer-top">
      <a routerLink="/" class="footer-logo">
        <span class="logo-tile" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
          </svg>
        </span>
        <span class="logo-text">Oxalate Info</span>
      </a>

      <nav aria-label="Footer navigation">
        <ul class="footer-links">
          <li>
            <button
              type="button"
              class="footer-link"
              aria-label="Search for Foods"
              (click)="search()"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <span>Search for Foods</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="footer-link"
              aria-label="Calculate Daily Intake"
              (click)="navigateToCalculateDailyIntake()"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="16" height="20" x="4" y="2" rx="2" />
                <path d="M8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01" />
              </svg>
              <span>Calculate Daily Intake</span>
            </button>
          </li>
          <li>
            <a routerLink="/contribution" class="footer-link">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
              </svg>
              <span>Support the Project</span>
            </a>
          </li>
          <li>
            <button
              type="button"
              class="footer-link"
              aria-label="Suggestions and Support"
              (click)="navigateToSuggestions()"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
              </svg>
              <span>Suggestions & Support</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <div class="footer-bottom">
      <p class="footer-text">© {{ currentYear }} Oxalate Info.</p>
      <ul class="footer-legal">
        <li><a class="footer-legal-link" routerLink="/privacy">Privacy</a></li>
        <li><a class="footer-legal-link" routerLink="/terms">Terms</a></li>
      </ul>
    </div>
  </div>
</footer>

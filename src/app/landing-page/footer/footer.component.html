<footer class="footer" id="footer">
  <div class="footer-content">
    <div class="footer-top">
      <a routerLink="/" class="footer-logo">
        <span class="logo-tile" aria-hidden="true">
          <app-icon name="leaf" [size]="20" />
        </span>
        <span class="logo-text">Oxalate Info</span>
      </a>

      <nav aria-label="Footer navigation">
        <ul class="footer-links">
          <li>
            <button
              type="button"
              class="footer-link"
              aria-label="Search for Foods"
              (click)="search()"
            >
              <app-icon name="search" />
              <span>Search for Foods</span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="footer-link"
              aria-label="Calculate Daily Intake"
              (click)="navigateToCalculateDailyIntake()"
            >
              <app-icon name="calculator" />
              <span>Calculate Daily Intake</span>
            </button>
          </li>
          <li>
            <a routerLink="/contribution" class="footer-link">
              <app-icon name="heart" />
              <span>Support the Project</span>
            </a>
          </li>
          <li>
            <button
              type="button"
              class="footer-link"
              aria-label="Suggestions and Support"
              (click)="navigateToSuggestions()"
            >
              <app-icon name="message-circle" />
              <span>Suggestions & Support</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <div class="footer-bottom">
      <p class="footer-text">© {{ currentYear }} Oxalate Info.</p>
      <ul class="footer-legal">
        <li><a class="footer-legal-link" routerLink="/privacy">Privacy</a></li>
        <li><a class="footer-legal-link" routerLink="/terms">Terms</a></li>
      </ul>
    </div>
  </div>
</footer>

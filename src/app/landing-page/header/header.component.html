<header id="header" class="header" [class.scrolled]="isScrolled">
  <div class="header-content">
    <button class="logo-container" (click)="goToLandingPage()">
      <span class="logo-text">Oxalate Info</span>
    </button>

    <button
      class="hamburger"
      (click)="toggleNav()"
      [class.open]="isNavOpen"
      [attr.aria-expanded]="isNavOpen"
      [attr.aria-label]="
        isNavOpen ? 'Close navigation menu' : 'Open navigation menu'
      "
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav
      class="nav"
      id="nav-bar"
      [class.open]="isNavOpen"
      role="navigation"
      aria-label="Main navigation"
    >
      <button
        class="nav-close"
        (click)="closeNav()"
        aria-label="Close navigation menu"
      ></button>

      <ng-container *ngIf="!(isMobile$ | async)">
        <a routerLink="/contribution" class="nav-link">Support the Project</a>
        <button
          class="calculate-btn"
          (click)="navigateToCalculateDailyIntake(); closeNav()"
          aria-label="Calculate Daily Oxalate Intake"
        >
          <span>Calculate Daily Intake</span>
        </button>
        <button
          class="search-btn"
          (click)="search(); closeNav()"
          aria-label="Search for Foods"
        >
          <!-- <mat-icon>search</mat-icon> -->
          <span>Search for Foods</span>
        </button>

        <button
          class="theme-toggle-btn"
          (click)="toggleTheme()"
          [attr.aria-label]="
            (isDarkTheme$ | async) ? 'Switch to light mode' : 'Switch to dark mode'
          "
        >
          <i
            class="fas"
            [class.fa-sun]="isDarkTheme$ | async"
            [class.fa-moon]="!(isDarkTheme$ | async)"
          ></i>
        </button>

        <button
          *ngIf="userProfile"
          class="profile-btn"
          (click)="goToProfile(); closeNav()"
          aria-label="Go to Profile"
        >
          <img
            [src]="
              userProfile.photoURL ||
              '../../../assets/images/default-profile.jpg'
            "
            alt="User Profile Picture"
            class="user-image"
            loading="lazy"
            width="32"
            height="32"
          />
        </button>

        <button
          *ngIf="!userProfile"
          class="user-icon-btn"
          (click)="goToLoginPage(); closeNav()"
          aria-label="Login or Sign Up"
        >
          <mat-icon>person_outline</mat-icon>
        </button>
      </ng-container>

      <ng-container *ngIf="isMobile$ | async">
        <div class="mobile-sidebar-nav">
          <ng-container *ngIf="userProfile; else mobileLoggedOut">
            <div
              class="profile-info-container"
              appClickable
              (click)="setActiveSection('profile'); goToProfile()"
            >
              <img
                [src]="
                  userProfile.photoURL ||
                  '../../../assets/images/default-profile.jpg'
                "
                alt="User Image"
                class="user-image"
                loading="lazy"
                width="32"
                height="32"
              />
              <a
                class="nav-link profile-link"
                [class.active]="(activeSection$ | async) === 'profile'"
              >
                <span>Profile Info</span>
              </a>
              <input
                type="file"
                id="profile-image-upload"
                class="profile-image-upload"
                (change)="onProfileImageChange($event)"
                accept="image/*"
                style="display: none"
              />
              <label
                for="profile-image-upload"
                class="profile-image-upload-label"
              >
                <mat-icon>edit</mat-icon>
              </label>
            </div>
            <a
              class="nav-link"
              [class.active]="(activeSection$ | async) === 'saveItem'"
              (click)="setActiveSection('saveItem'); navigateToSavedItems()"
            >
              <i class="fas fa-bookmark"></i>
              <span>Saved Items</span>
            </a>
          </ng-container>

          <ng-template #mobileLoggedOut>
            <a class="nav-link" (click)="goToLoginPage(); closeNav()">
              <mat-icon class="default-user-icon">person_outline</mat-icon>
              <span>Login or Sign Up</span>
            </a>
          </ng-template>

          <a class="nav-link" (click)="search(); closeNav()">
            <i class="fas fa-search"></i>
            <span>Search For Foods</span>
          </a>

          <a
            class="nav-link"
            [class.active]="(activeSection$ | async) === 'calculate-oxalate'"
            (click)="
              setActiveSection('calculate-oxalate');
              navigateToCalculateDailyIntake()
            "
          >
            <i class="fa fa-calculator"></i>
            <span>Calculate Daily Intake</span>
          </a>
          <a class="nav-link" (click)="goToSupport()">
            <i class="fas fa-life-ring"></i>
            <span>Support The Project</span>
          </a>

          <a
            class="nav-link"
            appClickable
            (click)="toggleTheme()"
            [attr.aria-label]="
              (isDarkTheme$ | async) ? 'Switch to light mode' : 'Switch to dark mode'
            "
          >
            <i
              class="fas"
              [class.fa-sun]="isDarkTheme$ | async"
              [class.fa-moon]="!(isDarkTheme$ | async)"
            ></i>
            <span>{{ (isDarkTheme$ | async) ? "Light Mode" : "Dark Mode" }}</span>
          </a>

          <a
            *ngIf="userProfile"
            (click)="onLogout()"
            class="nav-link logout"
          >
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </div>
      </ng-container>
    </nav>
  </div>
</header>

<app-auth-message></app-auth-message>

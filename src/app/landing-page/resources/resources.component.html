<div class="resources" id="resources">
  <h2 class="resource-title">Common Foods High in Oxalate</h2>
  <ul class="resource-content">
    @for (resource of foodResources; track resource.name; let i = $index) {
      <li class="resource-info">
        <div class="resource-header">
          <span
            class="resource-badge"
            [ngClass]="tintFor(resource.name, i)"
            aria-hidden="true"
            >{{ initial(resource.name) }}</span
          >
          <h3 class="resource-name">{{ resource.name }}</h3>
        </div>
        <p class="resource-text">{{ resource.description }}</p>
      </li>
    }
  </ul>
</div>

<div class="row">
  <div class="info">
    <span class="name">{{ ingredient.name }}</span>
    <span class="sub">{{ source }}</span>
  </div>

  <!-- Phones: the name + amount open the amount sheet. -->
  <button type="button" class="open" (click)="openAmount.emit()"
    [attr.aria-label]="'Change amount of ' + ingredient.name + ', ' + amountText"
    [attr.aria-describedby]="error ? errorId : null">
    <span class="name">{{ ingredient.name }}</span>
    <span class="sub">{{ amountText }}</span>
  </button>

  <app-amount-editor class="editor" [ingredient]="ingredient" [options]="options"
    [invalid]="!!error" [describedBy]="error ? errorId : null" (changed)="changed.emit($event)" />

  <span class="mg">
    @if (!hasAmount) {
      <span class="muted">—</span>
    } @else if (row?.known) {
      {{ mgText }}
    } @else {
      <span class="unknown"><app-icon name="alert-triangle" [size]="14" /> Unknown</span>
    }
  </span>

  <button type="button" class="remove" [attr.aria-label]="'Remove ' + ingredient.name" (click)="remove.emit()">
    <app-icon name="trash-2" [size]="18" />
  </button>

  @if (error) {
    <p class="row-error" [id]="errorId">{{ error }}</p>
  }
</div>

@if (authMessageService.showMessage$ | async) {
  <div class="auth-prompt-backdrop" (click)="onBackdropClick($event)">
    <div
      class="auth-prompt"
      appDialog
      aria-labelledby="auth-prompt-title"
      aria-describedby="auth-prompt-text"
      (dialogClose)="dismiss()"
    >
      <button
        type="button"
        class="auth-prompt-close"
        aria-label="Close"
        (click)="dismiss()"
      >
        <i class="material-icons" aria-hidden="true">close</i>
      </button>

      <h2 id="auth-prompt-title" class="auth-prompt-title">
        Track your daily oxalate intake
      </h2>
      <p id="auth-prompt-text" class="auth-prompt-text">
        This needs a free account, so your log is saved and ready on any device.
      </p>

      <ul class="auth-prompt-benefits">
        @for (benefit of benefits; track benefit.title) {
          <li class="auth-prompt-benefit">
            <span class="auth-prompt-icon" aria-hidden="true">
              <i class="material-icons">{{ benefit.icon }}</i>
            </span>
            <span>
              <strong>{{ benefit.title }}</strong>
              <span class="auth-prompt-benefit-text">{{ benefit.text }}</span>
            </span>
          </li>
        }
      </ul>

      <div class="auth-prompt-actions">
        <button
          type="button"
          class="ui-btn ui-btn--primary"
          data-autofocus
          (click)="signIn()"
        >
          Sign in or create account
        </button>
        <button type="button" class="ui-btn ui-btn--secondary" (click)="dismiss()">
          Not now
        </button>
      </div>
    </div>
  </div>
}

<app-alert *ngIf="showAlert" [message]="alertMessage"></app-alert>

<div class="app-container" [class.dark-theme]="isDarkTheme">
  <div class="content-wrapper">
    <header class="app-header">
      <div class="header-content">
        <div class="header-title">
          <h2>{{ mealType ? "Add to " + (mealType | titlecase) : "Oxalate" }}</h2>
          <p class="subtitle">
            {{
              mealType
                ? "Search for a food, then set how many servings you had."
                : "Log your daily intake"
            }}
          </p>
        </div>
      </div>
    </header>

    <div class="main-content">
      <div class="left-column">
        <app-search-section
          [foodName]="foodName"
          (foodNameChange)="onFoodNameChange($event)"
          [similarFoods]="similarFoods"
          [showSuggestions]="showSuggestions"
          (selectFood)="selectSuggestedFood($event)"
          [isDarkTheme]="isDarkTheme"
        ></app-search-section>

        <app-serving-panel
          [servingSize]="servingSize"
          [totalOxalatePerServing]="totalOxalatePerServing"
          [totalSolubleOxalatePerServing]="totalSolubleOxalatePerServing"
          [numberOfServings]="(numberOfServings || 0).toString()"
          (numberOfServingsChange)="onNumberOfServingsChange($event)"
          [isDarkTheme]="isDarkTheme"
        ></app-serving-panel>

        <div class="button-container">
          <button
            class="action-button calculate ui-btn ui-btn--primary"
            [disabled]="isCalculating || !foodName || !servingSize"
            (click)="mealType ? logMeal() : calculateOxalate()"
          >
            <i class="material-icons" aria-hidden="true">{{ mealType ? "add" : "calculate" }}</i>
            {{
              isCalculating
                ? "Calculating..."
                : mealType
                ? "Log Food"
                : "Calculate"
            }}
          </button>

          <button
            *ngIf="showResults"
            class="action-button clear ui-btn ui-btn--secondary"
            (click)="clearResults()"
          >
            <i class="material-icons" aria-hidden="true">refresh</i>
            New Calculation
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

@if (showAlert) {
  <app-alert [message]="alertMessage"></app-alert>
}

<div class="app-container" [class.dark-theme]="isDarkTheme">
  <div class="content-wrapper">
    <!-- A div, not <header>: inside a dialog a header would count as a second
         page banner for screen readers. -->
    <div class="app-header">
      <div class="header-content">
        <div class="header-title">
          <!-- The dialog around this form is labelled by this heading. -->
          <h2 id="add-food-title">{{ mealType ? "Add to " + (mealType | titlecase) : "Oxalate" }}</h2>
          <p class="subtitle">
            {{
            mealType
            ? "Search for a food, then set how many servings you had."
            : "Log your daily intake"
            }}
          </p>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="left-column">
        <app-search-section
          [foodName]="foodName"
          (foodNameChange)="onFoodNameChange($event)"
          [similarFoods]="similarFoods"
          [showSuggestions]="showSuggestions"
          (selectFood)="selectSuggestedFood($event)"
          (clear)="clearSearch()"
          (dismiss)="clearSuggestions()"
          [isDarkTheme]="isDarkTheme"
        ></app-search-section>

        <app-serving-panel
          [servingSize]="servingSize"
          [totalOxalatePerServing]="totalOxalatePerServing"
          [totalSolubleOxalatePerServing]="totalSolubleOxalatePerServing"
          [numberOfServings]="(numberOfServings || 0).toString()"
          (numberOfServingsChange)="onNumberOfServingsChange($event)"
          [isDarkTheme]="isDarkTheme"
        ></app-serving-panel>

        <div class="button-container">
          <button
            type="button"
            class="action-button calculate"
            [disabled]="isCalculating || !foodName || !servingSize"
            [attr.aria-disabled]="isCalculating || !foodName || !servingSize"
            (click)="mealType ? logMeal() : calculateOxalate()"
            >
            <app-icon [name]="mealType ? 'plus' : 'calculator'" [size]="18" />
            {{
            isCalculating
            ? "Calculating..."
            : mealType
            ? "Log Food"
            : "Calculate"
            }}
          </button>

          @if (showResults) {
            <button
              class="action-button clear ui-btn ui-btn--secondary"
              (click)="clearResults()"
              >
              <i class="material-icons" aria-hidden="true">refresh</i>
              New Calculation
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</div>

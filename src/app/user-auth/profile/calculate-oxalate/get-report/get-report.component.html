<div class="modal-overlay" (click)="close.emit()">
  <div
    class="modal-content"
    appDialog
    aria-labelledby="report-title"
    (dialogClose)="close.emit()"
    (click)="$event.stopPropagation()"
  >
    <app-alert *ngIf="showAlert" [message]="alertMessage"></app-alert>
    <div class="modal-header">
      <div class="header-content">
        <div class="title-section">
          <div class="title-wrapper">
            <h2 id="report-title">Download Report</h2>
            <div class="title-decoration"></div>
          </div>
          <p class="subtitle">Export your daily oxalate intake data</p>
        </div>
        <button class="close-button" (click)="close.emit()" aria-label="Close">
          <i class="material-icons icon-inline" aria-hidden="true">close</i>
        </button>
      </div>
      <div class="date-display">
        <div class="date-icon">
          <i class="material-icons icon-inline" aria-hidden="true">calendar_today</i>
        </div>
        <div class="date-content">
          <div class="date-label">Selected Date</div>
          <div class="selected-date">
            {{ selectedDate | date : "EEEE, MMMM d, y" }}
          </div>
        </div>
        <div class="date-decoration"></div>
      </div>
    </div>

    <div class="modal-body">
      <div class="download-options">
        <button class="download-button csv" (click)="downloadCSV()">
          <div class="button-content">
            <div class="icon-wrapper">
              <i class="material-icons icon-inline" aria-hidden="true">table_chart</i>
              <div class="icon-background"></div>
            </div>
            <div class="text-content">
              <span class="button-title">Download CSV</span>
              <span class="button-description"
                >Export data in spreadsheet format</span
              >
            </div>
          </div>
          <div class="button-hover-effect"></div>
          <div class="button-ripple"></div>
        </button>

        <button class="download-button pdf" (click)="downloadPDF()">
          <div class="button-content">
            <div class="icon-wrapper">
              <i class="material-icons icon-inline" aria-hidden="true">picture_as_pdf</i>
              <div class="icon-background"></div>
            </div>
            <div class="text-content">
              <span class="button-title">Download PDF</span>
              <span class="button-description"
                >Export data in document format</span
              >
            </div>
          </div>
          <div class="button-hover-effect"></div>
          <div class="button-ripple"></div>
        </button>
      </div>
    </div>
  </div>
</div>

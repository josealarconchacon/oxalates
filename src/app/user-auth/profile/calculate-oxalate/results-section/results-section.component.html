<div class="results-container" [ngClass]="{ 'dark-theme': isDarkTheme }">
  <div class="title-container">
    <h2 class="title">Daily Oxalate Breakdown</h2>
    <div class="action-buttons">
      <button
        type="button"
        class="action-btn share-icon"
        (click)="openShareMenu()"
        [disabled]="!hasFoodItems()"
        [attr.aria-label]="'Share daily oxalate breakdown'"
        >
        <app-icon name="share-2" [size]="18" />
      </button>
      <button
        type="button"
        class="action-btn download-icon"
        (click)="openReport()"
        [disabled]="!hasFoodItems()"
        [attr.aria-label]="'Download oxalate report'"
        >
        <app-icon name="download" [size]="18" />
      </button>
    </div>
  </div>

  <div class="content-container">
    <!-- Same text and values as before, split into a label and a big number. -->
    <dl class="total-oxalates">
      <div class="stat-tile">
        <dt class="stat-label">Total Oxalate:</dt>
        <dd class="stat-value">
          <span class="stat-number">{{ totalOxalate | number : "1.1-1" }}</span>
          <span class="unit"> mg</span>
        </dd>
      </div>
      <div class="stat-tile">
        <dt class="stat-label">Total Soluble Oxalate:</dt>
        <dd class="stat-value">
          <span class="stat-number">{{ totalSolubleOxalate | number : "1.1-1" }}</span>
          <span class="unit"> mg</span>
        </dd>
      </div>
    </dl>

  </div>

  @if (shareMenuVisible) {
    <app-share-menu
      [dailyMeals]="mealItems"
  [dailyTotal]="{
    totalOxalate: totalOxalate,
    totalSolubleOxalate: totalSolubleOxalate
  }"
      (close)="closeShareMenu()"
    ></app-share-menu>
  }

  @if (showReport) {
    <app-get-report
      [mealItems]="mealItems"
      [totalOxalate]="inputTotalOxalate"
      [totalSolubleOxalate]="inputTotalSolubleOxalate"
      [selectedDate]="selectedDate"
      (close)="closeReport()"
    ></app-get-report>
  }

<div class="search-section" [ngClass]="{ 'dark-theme': isDarkTheme }">
  <div class="search-wrapper">
    <label class="sr-only" for="food-search">Search foods</label>
    <app-icon class="search-icon" name="search" [size]="20" />
    <input
      #searchInput
      id="food-search"
      type="text"
      autocomplete="off"
      [(ngModel)]="query"
      (ngModelChange)="onFoodNameChange($event)"
      placeholder="Search foods..."
      class="search-input"
      [class.has-clear]="!!query"
      />
    @if (query) {
      <button
        type="button"
        class="clear-button"
        aria-label="Clear search"
        (click)="onClear(searchInput)"
        >
        <app-icon name="x" [size]="16" />
      </button>
    }
  </div>

  @if (showSuggestions && similarFoods.length > 0) {
    <div
      class="suggestions-panel"
      >
      @for (food of similarFoods; track food) {
        <div
          class="food-card"
          appClickable
          (click)="onSelectFood(food)"
          >
          <div class="food-header">
            <div class="food-info">
              <span class="food-name">{{ food.name }}</span>
            </div>
            <div class="oxalate-info">
              <div class="info-item">
                <span class="label">Oxalate Per Serving:</span>
                <span class="value"
                  >{{ food.totalOxalate | number : "1.2-2" }} mg</span
                  >
                </div>
                <div class="info-item">
                  <span class="label">Soluble Oxalate Per Serving:</span>
                  <span class="value"
                    >{{ food.solubleOxalate | number : "1.2-2" }} mg</span
                    >
                  </div>
                </div>
              </div>
            </div>
          }
        </div>
      }
    </div>

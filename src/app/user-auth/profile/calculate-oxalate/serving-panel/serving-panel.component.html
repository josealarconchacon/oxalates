<div class="serving-panel">
  <!-- The picked food's values: results, not inputs. Read out again when they
       change, so screen-reader users hear them after picking a food. -->
  <dl
    class="summary-strip"
    [class.is-empty]="!servingSize"
    aria-live="polite"
  >
    <div class="summary-cell">
      <dt>Serving Size</dt>
      <dd>{{ servingSize || "0" }}</dd>
    </div>
    <div class="summary-cell">
      <dt>Total Oxalate Per Serving</dt>
      <dd>{{ totalOxalatePerServing }}</dd>
    </div>
    <div class="summary-cell">
      <dt>Total Soluble Oxalate Per Serving</dt>
      <dd>{{ totalSolubleOxalatePerServing }}</dd>
    </div>
  </dl>

  <div class="servings-row">
    <label for="number-of-servings">Number of Servings</label>
    <!-- −/+ change it by 1; typing still works (decimals too). -->
    <div class="stepper">
      <button
        type="button"
        class="step-button"
        aria-label="Decrease servings"
        aria-controls="number-of-servings"
        [disabled]="!canDecrease"
        (click)="step(-1)"
      >
        <app-icon name="minus" [size]="18" />
      </button>
      <input
        id="number-of-servings"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        [ngModel]="numberOfServings"
        (ngModelChange)="onNumberOfServingsChange($event)"
        placeholder="Enter number of servings"
        class="input-field"
      />
      <button
        type="button"
        class="step-button"
        aria-label="Increase servings"
        aria-controls="number-of-servings"
        (click)="step(1)"
      >
        <app-icon name="plus" [size]="18" />
      </button>
    </div>
  </div>
</div>

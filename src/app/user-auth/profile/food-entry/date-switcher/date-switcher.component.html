<!-- One pill: previous day, the date (opens the calendar), next day. -->
<div class="date-switcher" role="group" aria-label="Change date">
  <button
    type="button"
    (click)="previousDay()"
    class="nav-button"
    aria-label="Previous day"
  >
    <app-icon name="chevron-left" [size]="20" />
  </button>

  <div class="date-display">
    <mat-datepicker #picker (opened)="openDatePicker()"></mat-datepicker>
    <button
      type="button"
      class="date-button"
      aria-haspopup="dialog"
      [attr.aria-label]="
        'Change date, currently ' + (selectedDate | date : 'fullDate')
      "
      (click)="picker.open()"
    >
      <app-icon class="calendar-icon" name="calendar" [size]="20" />
      <span class="formatted-date">
        <span class="day">{{ selectedDate | date : "EEEE" }}</span>
        <span class="date">{{ selectedDate | date : "MMM d, y" }}</span>
      </span>
    </button>
    <!-- Hidden anchor the picker attaches to. The button above is the real
         control, so keep this out of the Tab order and the accessibility tree. -->
    <input
      tabindex="-1"
      aria-hidden="true"
      [matDatepicker]="picker"
      [ngModel]="selectedDate"
      (ngModelChange)="onDateChange($event)"
      class="date-input"
      #dateInput
    />
  </div>

  <button
    type="button"
    (click)="nextDay()"
    class="nav-button"
    aria-label="Next day"
  >
    <app-icon name="chevron-right" [size]="20" />
  </button>
</div>

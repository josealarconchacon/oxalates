<div class="master-detail-container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2 class="section-title">Saved Foods</h2>
    </div>
    <div class="sidebar-content">
      <ng-container *ngIf="savedOxalates$ | async as savedOxalates">
        <ng-container *ngIf="savedOxalates.length > 0; else noItems">
          <div *ngFor="let oxalate of savedOxalates" class="item-wrapper">
            <button
              class="list-item"
              [class.selected]="expandedCardId === oxalate.id"
              (click)="handleCardClick(oxalate.id)"
            >
              <div class="item-content">
                <div class="item-title">{{ oxalate.item }}</div>
                <div class="item-subtitle">{{ getSubtitle(oxalate) }}</div>
              </div>
              <i
                class="fas"
                [class.fa-chevron-right]="expandedCardId !== oxalate.id"
                [class.fa-chevron-down]="expandedCardId === oxalate.id"
              ></i>
            </button>

            <div
              *ngIf="expandedCardId === oxalate.id"
              class="mobile-detail-dropdown"
            >
              <div class="item-details">
                <div class="item-header">
                  <h3>{{ oxalate.item }}</h3>
                  <div class="item-actions">
                    <ng-container
                      *ngTemplateOutlet="deleteControls; context: { $implicit: oxalate }"
                    ></ng-container>
                  </div>
                </div>
                <div *ngFor="let detail of oxalate | keyvalue">
                  <p
                    *ngIf="detail.key !== 'id' && detail.value"
                    class="detail-item"
                  >
                    <span class="detail-key">{{ formatKey(detail.key) }}:</span>
                    <span class="detail-value">
                      {{ detail.value }}
                      <span *ngIf="isMeasurementKey(detail.key)"> (mg)</span>
                    </span>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>
    </div>
  </div>

  <div class="detail-view">
    <ng-container *ngIf="savedOxalates$ | async as savedOxalates">
      <ng-container *ngIf="savedOxalates.length > 0">
        <ng-container *ngIf="expandedCardId">
          <div *ngFor="let oxalate of savedOxalates">
            <div *ngIf="oxalate.id === expandedCardId" class="item-details">
              <div class="item-header">
                <h3>{{ oxalate.item }}</h3>
                <div class="item-actions">
                  <ng-container
                    *ngTemplateOutlet="deleteControls; context: { $implicit: oxalate }"
                  ></ng-container>
                </div>
              </div>
              <div *ngFor="let detail of oxalate | keyvalue">
                <p
                  *ngIf="detail.key !== 'id' && detail.value"
                  class="detail-item"
                >
                  <span class="detail-key">{{ formatKey(detail.key) }}:</span>
                  <span class="detail-value">
                    {{ detail.value }}
                    <span *ngIf="isMeasurementKey(detail.key)"> (mg)</span>
                  </span>
                </p>
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>
    </ng-container>
  </div>
</div>

<ng-template #noItems>
  <div class="no-items">
    <i class="fas fa-bookmark fa-3x"></i>
    <h3>No saved items yet</h3>
    <p>Items you save will appear here</p>
  </div>
</ng-template>

<!-- Delete control shared by the list dropdown and the detail view: a labelled
     trash button that asks for confirmation inline before deleting. -->
<ng-template #deleteControls let-oxalate>
  <div
    *ngIf="pendingDeleteId === oxalate.id; else deleteTrigger"
    class="delete-confirm"
    role="group"
    [attr.aria-label]="'Confirm deleting ' + oxalate.item"
  >
    <span class="delete-confirm-text">Delete this food?</span>
    <button
      type="button"
      class="confirm-button confirm-delete-button"
      (click)="deleteOxalate(oxalate.id)"
    >
      Delete
    </button>
    <button
      type="button"
      class="confirm-button cancel-delete-button"
      (click)="cancelDelete()"
    >
      Cancel
    </button>
  </div>
  <ng-template #deleteTrigger>
    <button
      type="button"
      class="action-button delete-button"
      [attr.data-delete-id]="oxalate.id"
      [attr.aria-label]="'Delete ' + oxalate.item"
      (click)="askDelete(oxalate.id)"
    >
      <i class="fas fa-trash-alt" aria-hidden="true"></i>
    </button>
  </ng-template>
</ng-template>

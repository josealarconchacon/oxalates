<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oxalates</title>
    <base href="/" />
    <script>
      /* Apply the theme before the first paint so a dark-mode visitor never sees a
         white page while Angular starts. Mirrors ThemeService: a saved 'dark' or
         'light' wins, otherwise the OS setting decides. */
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' || saved === 'light'
              ? saved === 'dark'
              : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark-theme');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      /* First-paint background for dark mode, before the real stylesheet has
         arrived. Keep it equal to the dark --background-color token in
         src/styles/tokens/colors.css. */
      html.dark-theme {
        background-color: #0f1512;
      }
      /* Keeps a page's top margin (the landing page has 96px) inside the app,
         so it does not collapse through and push the whole <body> down when the
         app replaces the loading placeholder. */
      app-root {
        display: flow-root;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#17603f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Track your daily oxalate intake and stay healthy!"
    />
    <meta property="og:title" content="Daily Oxalate Summary" />
    <meta
      property="og:description"
      content="Track your daily oxalate intake and stay healthy!"
    />
    <meta
      property="og:image"
      content="https://oxalate.info/assets/app-logo/load.png"
    />
    <meta property="og:image:width" content="476" />
    <meta property="og:image:height" content="465" />
    <meta
      property="og:image:alt"
      content="The Oxalate calculator searching for almonds, showing oxalate per serving"
    />
    <meta property="og:url" content="https://oxalate.info/" />
    <meta property="og:type" content="website" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Manrope:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block"
      rel="stylesheet"
    />

  </head>
  <body>
    <noscript>
      <p>Please enable JavaScript to use this application.</p>
    </noscript>
    <app-root>
      <div role="status" aria-live="polite" class="app-loading">Loading...</div>
    </app-root>
  </body>
</html>
